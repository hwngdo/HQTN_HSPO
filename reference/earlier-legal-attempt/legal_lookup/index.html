<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tra cứu văn bản pháp lý · HQTN_HSPO</title>
<style>
:root{--blue:#0068b5;--blue-dark:#00518f;--bg:#f3f7fb;--line:#d9e3ee;--text:#16243a;--muted:#66768a;--red:#b42318;--amber:#a45d00;--green:#067647}*{box-sizing:border-box}body{margin:0;font:14px/1.46 "Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--text)}button,input,select{font:inherit}.wrap{padding:14px}.panel{background:#fff;border:1px solid var(--line);border-radius:11px}.head{padding:15px 16px;display:flex;gap:14px;align-items:flex-start;justify-content:space-between}.head h1{font-size:19px;margin:0 0 4px;color:var(--blue-dark)}.muted{color:var(--muted)}.ver{white-space:nowrap;background:#eaf5ff;color:#155d95;border-radius:999px;padding:4px 9px;font-size:11px;font-weight:750}.rule{margin:0 0 12px;background:#fff8e7;border:1px solid #f0d7a9;border-radius:9px;padding:10px 12px;color:#6d4b0b}.tools{display:grid;grid-template-columns:minmax(280px,1fr) 180px 180px 190px auto;gap:8px;padding:12px}.tools input,.tools select{border:1px solid #c9d6e4;border-radius:8px;padding:9px 10px;background:#fff;min-width:0}.btn{border:1px solid #d5e0eb;border-radius:8px;padding:9px 13px;background:#f8fafc;cursor:pointer;font-weight:650}.btn:hover{background:#edf5fc}.grid{display:grid;grid-template-columns:minmax(500px,1.55fr) minmax(350px,1fr);gap:12px;margin-top:12px}.list,.detail{min-height:500px;max-height:calc(100vh - 205px);overflow:auto}.stats{padding:8px 12px;border-bottom:1px solid var(--line);display:flex;gap:12px;flex-wrap:wrap;font-size:12px}.stats b{color:var(--blue-dark)}table{width:100%;border-collapse:collapse;table-layout:fixed}th{position:sticky;top:0;background:#f5f9fd;text-align:left;color:#526277;font-size:12px;padding:9px;border-bottom:1px solid var(--line);z-index:2}td{padding:9px;border-bottom:1px solid #edf1f5;vertical-align:top;word-break:break-word}tr.row{cursor:pointer}tr.row:hover{background:#f2f8fd}tr.row.sel{background:#e8f4ff;box-shadow:inset 4px 0 var(--blue)}.tag{display:inline-block;border-radius:999px;padding:3px 7px;font-size:11px;font-weight:750}.tag.blue{background:#e7f3fd;color:#155d95}.tag.amber{background:#fff1cf;color:#8c5200}.tag.green{background:#e8f7ef;color:#067647}.tag.gray{background:#edf1f5;color:#526277}.tag.red{background:#feeceb;color:#b42318}.detail{padding:16px}.detail h2{margin:0 0 5px;font-size:18px;color:#174c75}.field{padding:9px 0;border-bottom:1px solid #edf1f5}.field>b{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.25px;color:#697a8d;margin-bottom:3px}.box{border:1px solid var(--line);background:#fbfdff;border-radius:9px;padding:10px 11px;margin-top:10px}.box h3{margin:0 0 7px;font-size:14px;color:#274d69}.warn{background:#fff8e7;border-color:#f0d7a9}.info{background:#eef7ff;border-color:#cfe6fa}.rel{padding:8px 0;border-bottom:1px dashed #d7e1ea}.rel:last-child{border-bottom:0}.rel small{display:block;color:var(--muted);margin-top:3px}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.actions a{color:#155d95;text-decoration:none;border:1px solid #cfe1ef;border-radius:7px;padding:7px 9px;background:#fff;font-weight:650}.empty{padding:36px;text-align:center;color:var(--muted)}.num{font-family:Consolas,monospace;font-weight:800;color:#154d75}.title{font-weight:650}.foot{font-size:11.5px;color:var(--muted);margin-top:10px}@media(max-width:1000px){.tools{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}.list,.detail{max-height:none}.tools .wide{grid-column:1/-1}}@media(max-width:620px){.tools{grid-template-columns:1fr}.tools .wide{grid-column:auto}.head{flex-direction:column}}
</style></head><body><div class="wrap">
<div class="panel head"><div><h1>Tra cứu văn bản pháp lý</h1><div class="muted">Theo dõi văn bản, quan hệ sửa đổi/bổ sung/thay thế và rà soát riêng phụ lục – mẫu biểu.</div></div><span class="ver">Module 2.0.1</span></div>
<div id="principle" class="rule">Đang nạp nguyên tắc rà soát…</div>
<div class="panel tools"><input id="q" class="wide" placeholder="Tìm số văn bản, tên văn bản, cơ quan, ghi chú…"><select id="cat"><option value="">Tất cả lĩnh vực</option></select><select id="issuer"><option value="">Tất cả cơ quan</option></select><select id="forms"><option value="">Tất cả mẫu biểu</option><option value="review">Có dấu hiệu phụ lục/mẫu – cần rà soát</option><option value="nohint">Chưa phát hiện dấu hiệu mẫu</option></select><button id="clear" class="btn">Xóa lọc</button></div>
<div class="grid"><div class="panel list"><div id="stats" class="stats"></div><table><thead><tr><th style="width:160px">Văn bản</th><th>Nội dung</th><th style="width:150px">Hiệu lực ghi nhận</th><th style="width:155px">Mẫu biểu</th></tr></thead><tbody id="rows"></tbody></table></div><div id="detail" class="panel detail"><div class="empty">Chọn một văn bản để xem chi tiết.</div></div></div>
</div><script>
const $=id=>document.getElementById(id);let DB=null,OV={documents:{},relations:[],forms:[]},VISIBLE=[],SELECTED=null;
const CAT={hs_master:'HS & phân loại',tax:'Thuế XNK',vat:'VAT',quality:'Chính sách mặt hàng',chemical:'Hóa chất',quarantine:'Kiểm dịch',other:'Khác'};
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function norm(v){return String(v||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/đ/g,'d')}
function docKey(v){return String(v||'').trim().toUpperCase()}
async function load(){DB=await fetch('data/legal_index.json',{cache:'no-store'}).then(r=>r.json());try{OV=await fetch('/static/legal_data/legal_overrides.json',{cache:'no-store'}).then(r=>r.json())}catch(e){};$('principle').textContent=DB.principle;fillFilters();apply()}
function fillFilters(){let cats=[...new Set(DB.documents.map(x=>x.category))].sort(), issuers=[...new Set(DB.documents.map(x=>x.issuing_body).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'vi'));for(let c of cats)$('cat').insertAdjacentHTML('beforeend',`<option value="${esc(c)}">${esc(CAT[c]||c)}</option>`);for(let x of issuers)$('issuer').insertAdjacentHTML('beforeend',`<option>${esc(x)}</option>`)}
function merged(d){let o=(OV.documents||{})[docKey(d.document_no)]||{};return {...d,...o}}
function apply(){let q=norm($('q').value),c=$('cat').value,iss=$('issuer').value,f=$('forms').value;VISIBLE=DB.documents.map(merged).filter(d=>{let text=norm([d.document_no,d.title,d.issuing_body,d.note,d.effective_note].join(' '));if(q&&!text.includes(q))return false;if(c&&d.category!==c)return false;if(iss&&d.issuing_body!==iss)return false;if(f==='review'&&d.forms_review_status!=='NEEDS_REVIEW')return false;if(f==='nohint'&&d.forms_review_status==='NEEDS_REVIEW')return false;return true});renderRows();$('stats').innerHTML=`<span><b>${VISIBLE.length}</b> / ${DB.stats.documents} văn bản</span><span><b>${VISIBLE.filter(x=>x.forms_review_status==='NEEDS_REVIEW').length}</b> có dấu hiệu phụ lục/mẫu cần rà soát</span><span><b>${DB.stats.relation_candidates}</b> quan hệ tự phát hiện đang ở trạng thái ứng viên</span>`;if(SELECTED){let i=VISIBLE.findIndex(x=>x.document_no===SELECTED.document_no);if(i>=0)pick(i)}}
function formTag(d){if(d.forms_review_status==='VERIFIED_CURRENT')return '<span class="tag green">Mẫu đã xác minh</span>';if(d.forms_review_status==='REPLACED')return '<span class="tag red">Mẫu đã bị thay</span>';if(d.forms_review_status==='NEEDS_REVIEW')return '<span class="tag amber">Cần rà soát mẫu</span>';return '<span class="tag gray">Chưa thấy dấu hiệu</span>'}
function renderRows(){let tb=$('rows');if(!VISIBLE.length){tb.innerHTML='<tr><td colspan="4" class="empty">Không có văn bản phù hợp bộ lọc.</td></tr>';return}tb.innerHTML=VISIBLE.map((d,i)=>`<tr class="row" onclick="pick(${i},this)"><td><span class="num">${esc(d.document_no||'—')}</span><div class="muted">${esc(CAT[d.category]||d.category||'')}</div></td><td><div class="title">${esc(d.title||'Chưa có tiêu đề')}</div><div class="muted">${esc(d.issuing_body||'')}</div></td><td>${esc(d.effective||'Chưa ghi nhận')}<div class="muted">${d.legal_status==='VERIFIED_ACTIVE'?'<span class="tag green">Đã xác minh</span>':'<span class="tag gray">Chưa xác minh hiệu lực</span>'}</div></td><td>${formTag(d)}</td></tr>`).join('')}
function link(path,label){return path?`<a target="_blank" rel="noopener" href="/static/documents/${path.split('/').map(encodeURIComponent).join('/')}">${label}</a>`:''}
function relationsFor(no){let k=docKey(no);let cand=(DB.relation_candidates||[]).filter(r=>docKey(r.source_document_no)===k||docKey(r.target_document_no)===k);let verified=(OV.relations||[]).filter(r=>docKey(r.source_document_no)===k||docKey(r.target_document_no)===k).map(r=>({...r,status:'VERIFIED'}));return [...verified,...cand]}
function relHtml(r,no){let incoming=docKey(r.target_document_no)===docKey(no),other=incoming?r.source_document_no:r.target_document_no,status=r.status==='VERIFIED'?'<span class="tag green">Đã xác minh</span>':'<span class="tag amber">Ứng viên – cần xác minh</span>';return `<div class="rel"><b>${incoming?'Văn bản khác có thể tác động đến văn bản này':'Văn bản này có thể tác động đến văn bản khác'}:</b> ${esc(other||'—')}<br><span>${esc(r.relation_hint||r.relation_type||'Quan hệ pháp lý')}</span> ${status}${r.snippet?`<small>${esc(r.snippet)}</small>`:''}</div>`}
function pick(i,tr){SELECTED=VISIBLE[i];document.querySelectorAll('tr.row').forEach(x=>x.classList.remove('sel'));if(tr)tr.classList.add('sel');let d=SELECTED,rels=relationsFor(d.document_no),formNote=d.forms_review_status==='NEEDS_REVIEW'?`<div class="box warn"><h3>Phụ lục / mẫu biểu</h3>${formTag(d)}<div style="margin-top:6px">Hệ thống phát hiện dấu hiệu ${d.form_hint?'mẫu biểu':''}${d.form_hint&&d.appendix_hint?' và ':''}${d.appendix_hint?'phụ lục':''}. Đây chỉ là tín hiệu rà soát. Phải kiểm tra văn bản sửa đổi/bổ sung sau này có thay mẫu, bổ sung mẫu hoặc bãi bỏ mẫu hay không.</div>${d.appendix_file?`<div class="actions">${link(d.appendix_file,'Mở phụ lục đang lưu')}</div>`:''}</div>`:`<div class="box"><h3>Phụ lục / mẫu biểu</h3>${formTag(d)}<div class="muted" style="margin-top:6px">Chưa phát hiện từ khóa mẫu/phụ lục trong lớp văn bản đã lập chỉ mục; không đồng nghĩa chắc chắn văn bản không có mẫu biểu.</div></div>`;
$('detail').innerHTML=`<h2>${esc(d.document_no||'Văn bản')}</h2><div class="title">${esc(d.title||'Chưa có tiêu đề')}</div><div class="field"><b>Cơ quan ban hành</b>${esc(d.issuing_body||'Chưa ghi nhận')}</div><div class="field"><b>Lĩnh vực</b>${esc(CAT[d.category]||d.category||'Khác')}</div><div class="field"><b>Ngày hiệu lực ghi trong registry</b>${esc(d.effective||'Chưa ghi nhận')}${d.effective_note?`<div class="muted">${esc(d.effective_note)}</div>`:''}</div><div class="box info"><h3>Tình trạng hiệu lực pháp lý</h3>${d.legal_status==='VERIFIED_ACTIVE'?'<span class="tag green">Đã xác minh còn hiệu lực</span>':'<span class="tag gray">Chưa xác minh đầy đủ trong module</span>'}<div class="muted" style="margin-top:6px">Ngày hiệu lực được hiển thị từ registry hiện có; trạng thái còn hiệu lực/hết hiệu lực/thay thế phải được xác minh theo chuỗi văn bản.</div></div>${formNote}<div class="box"><h3>Quan hệ sửa đổi / bổ sung / thay thế</h3>${rels.length?rels.map(r=>relHtml(r,d.document_no)).join(''):'<div class="muted">Chưa phát hiện quan hệ từ lớp văn bản hiện có. Vẫn cần kiểm tra khi sử dụng cho hồ sơ thực tế.</div>'}</div>${d.note?`<div class="field"><b>Ghi chú dữ liệu hiện có</b>${esc(d.note)}</div>`:''}<div class="actions">${link(d.pdf_file,'Mở PDF')}${link(d.file,'Mở Word')}${link(d.appendix_file,'Mở phụ lục')}</div><div class="foot">Nguyên tắc 2.0.1: quan hệ tự phát hiện chỉ là ứng viên rà soát; hệ thống không tự kết luận hiệu lực hoặc mẫu biểu hiện hành.</div>`}
['q','cat','issuer','forms'].forEach(id=>$(id).addEventListener(id==='q'?'input':'change',apply));$('clear').onclick=()=>{$('q').value='';$('cat').value='';$('issuer').value='';$('forms').value='';SELECTED=null;apply();$('detail').innerHTML='<div class="empty">Chọn một văn bản để xem chi tiết.</div>'};load().catch(e=>{$('rows').innerHTML=`<tr><td colspan="4" class="empty">Không nạp được dữ liệu module: ${esc(e.message)}</td></tr>`});
</script></body></html>
